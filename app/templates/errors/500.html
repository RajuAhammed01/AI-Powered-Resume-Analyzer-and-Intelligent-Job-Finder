{% extends "base.html" %}

{% block content %}
<div class="card-panel" style="max-width: 600px; margin: 3rem auto; text-align: center; padding: 3.5rem 2rem;">
    <div style="width: 70px; height: 70px; border-radius: 50%; background: #fef2f2; color: #ef4444; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.25rem;">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    
    <h1 style="font-family: var(--font-heading); font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;">
        Something went wrong
    </h1>
    
    <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem;">
        We could not complete that request. Please try again or return to the dashboard.
    </p>

    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary btn-pill">
            <i class="fa-solid fa-house"></i> Dashboard
        </a>
        <a href="{{ url_for('main.index') }}" class="btn btn-outline btn-pill">
            Return Home
        </a>
    </div>
</div>
{% endblock %}
